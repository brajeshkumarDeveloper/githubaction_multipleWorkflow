name: Deployment Workflow-2
on: push
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Lint Code
        run: |
          pip install flake8
          flake8 .

  test:
      runs-on: ubuntu-latest
      steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
     
      - name: Test Code
        run: |
          pip install pytest
          pytest tests/
      - name: Build Project
        run: |
          python setup.py sdist bdist_wheel

  deploy:
      runs-on: ubuntu-latest
      steps:
      - name: Get Code
        uses: actions/checkout@v3 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip        
      - name: Deploy Project
        run: |
          echo "Deploying the project..."
          # Add your deployment commands here
        